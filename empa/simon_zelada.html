<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodic Simon: Desafío de Oído (Pentacordio)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0f0f13; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        canvas { display: block; border-radius: 12px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6); }
    </style>
</head>
<body>
<script>
    p5.disableFriendlyErrors = true; 

    let piano; 
    const pentacordio = ["C4", "D4", "E4", "F4", "G4"];
    const nombresNotas = ["DO", "RE", "MI", "FA", "SOL"];
    const coloresNotas = ['#e53e3e', '#dd6b20', '#ecc94b', '#38a169', '#3182ce']; 

    let gameState = "LOADING"; 
    let gameMode = "FACIL";     
    let secuencia = [];        
    let indiceSecuencia = 0;   
    let pasosUsuario = 0;      
    let notaActivaVisual = -1; 
    let score = 0;
    let highscore = 0;
    let timerAnimacion = 0;
    
    // VARIABLE ANTI-REBOTE (Evita el doble toque fantasma en celulares)
    let ultimoToque = 0; 

    let teclas = [];
    let btnFacil, btnDificil, btnVolver;

    function setup() {
        createCanvas(550, 650);
        textAlign(CENTER, CENTER);

        piano = new Tone.Sampler({
            urls: { "C4": "C4.mp3", "E4": "E4.mp3", "F#4": "Gb4.mp3", "A4": "A4.mp3" },
            baseUrl: "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/", 
            onload: () => { gameState = "START"; }
        }).toDestination();
        piano.volume.value = -2;

        // BOTÓN VOLVER A LA WEB EMPA
        btnVolver = createButton('⬅ VOLVER A EMPA');
        btnVolver.position(20, 20);
        btnVolver.size(130, 32);
        styleButton(btnVolver, '#2d3748');
        btnVolver.style('font-size', '11px');
        btnVolver.mousePressed(() => { window.location.href = '../index.html'; });

        let anchoTecla = 90;
        let altoTecla = 240;
        let inicioX = (width - (anchoTecla * 5)) / 2;
        let yTecla = height / 2 - 40;

        for (let i = 0; i < 5; i++) {
            teclas.push({ x: inicioX + (i * anchoTecla), y: yTecla, w: anchoTecla, h: altoTecla, nota: pentacordio[i], nombre: nombresNotas[i], color: coloresNotas[i] });
        }

        btnFacil = createButton('🟢 MODO FÁCIL (Visual)');
        btnFacil.position(width / 2 - 190, height - 90);
        btnFacil.size(180, 45);
        styleButton(btnFacil, '#2f855a');
        btnFacil.mousePressed(() => iniciarPartida("FACIL"));

        btnDificil = createButton('🔴 MODO DIFÍCIL (Oído)');
        btnDificil.position(width / 2 + 10, height - 90);
        btnDificil.size(180, 45);
        styleButton(btnDificil, '#9b2c2c');
        btnDificil.mousePressed(() => iniciarPartida("DIFICIL"));
    }

    function draw() {
        background(18, 18, 24);

        fill('#e2e8f0');
        textSize(24);
        textStyle(BOLD);
        text("MELODIC SIMON", width / 2 + 60, 36);
        
        textSize(13);
        textStyle(NORMAL);
        fill('#a0aec0');
        text("Pentacordio de Do • Práctica auditiva avanzada", width / 2, 75);

        drawScoreboard();

        if (gameState === "TONIC_WARMUP") escucharTonicaInicial();
        else if (gameState === "PLAYING_SEQUENCE") gestionarSecuenciaAutomatica();

        drawTeclado();
        drawMensajesEstado();
    }

    function drawTeclado() {
        for (let i = 0; i < teclas.length; i++) {
            let t = teclas[i];
            let debeIluminarse = false;
            if (notaActivaVisual === i) {
                if (gameState === "USER_TURN" || gameState === "TONIC_WARMUP" || gameMode === "FACIL") debeIluminarse = true;
            }
            if (debeIluminarse) fill(t.color);
            else fill(240);
            
            stroke('#1a202c'); strokeWeight(4); rect(t.x, t.y, t.w, t.h, 0, 0, 8, 8);
            if (debeIluminarse) { fill(255); textStyle(BOLD); }
            else { fill('#4a5568'); textStyle(NORMAL); }
            textSize(18); text(t.nombre, t.x + t.w / 2, t.y + t.h - 30);
        }
    }

    function drawScoreboard() {
        stroke('#2d3748'); strokeWeight(2); fill(26, 26, 36); rect(75, 105, 400, 65, 8);
        noStroke(); fill('#a0aec0'); textSize(11); text("NOTAS COMPLETADAS", 175, 125); text("RÉCORD MÁXIMO", 375, 125);
        fill('#fff'); textSize(22); textStyle(BOLD); text(score, 175, 148); text(highscore, 375, 148); textStyle(NORMAL);
    }

    function drawMensajesEstado() {
        noStroke(); textSize(15);
        if (gameState === "LOADING") { fill('#ecc94b'); text("Conectando con el piano online... 🎹", width / 2, height / 2 - 75); }
        else if (gameState === "START") { fill('#cbd5e0'); text("Elegí un nivel abajo para establecer el centro tonal...", width / 2, height / 2 - 75); }
        else if (gameState === "TONIC_WARMUP") { fill('#ecc94b'); textStyle(BOLD); text("🔊 Estableciendo centro tonal: Escuchá la TÓNICA (DO)", width / 2, height / 2 - 75); textStyle(NORMAL); }
        else if (gameState === "PLAYING_SEQUENCE") {
            fill('#63b3ed');
            if (gameMode === "FACIL") text("👀 Mirá y escuchá la secuencia...", width / 2, height / 2 - 75);
            else text("👂 Escuchá con atención (Teclado oculto a ciegas)...", width / 2, height / 2 - 75);
        }
        else if (gameState === "USER_TURN") { fill('#48bb78'); textStyle(BOLD); text(`🎹 ¡Tu turno! Toca de memoria (${pasosUsuario}/${secuencia.length})`, width / 2, height / 2 - 75); textStyle(NORMAL); }
        else if (gameState === "GAME_OVER") { fill('#f56565'); textStyle(BOLD); text(`¡Nota incorrecta! Llegaste hasta la nota ${score} 😢`, width / 2, height / 2 - 75); textStyle(NORMAL); }
    }

    function iniciarPartida(modoSeleccionado) {
        if (gameState === "LOADING") return;
        Tone.start();
        gameMode = modoSeleccionado; secuencia = []; score = 0;
        btnFacil.hide(); btnDificil.hide();
        gameState = "TONIC_WARMUP"; timerAnimacion = millis(); notaActivaVisual = 0;
        piano.triggerAttackRelease("C4", "1.0");
    }

    function escucharTonicaInicial() {
        if (millis() - timerAnimacion > 1500) { notaActivaVisual = -1; agregarNuevaNotaASecuencia(); }
    }

    function agregarNuevaNotaASecuencia() {
        if (secuencia.length === 0) secuencia.push("C4");
        else secuencia.push(random(pentacordio));
        gameState = "PLAYING_SEQUENCE"; indiceSecuencia = 0; timerAnimacion = millis(); notaActivaVisual = -1;
    }

    function gestionarSecuenciaAutomatica() {
        let tiempoActual = millis();
        if (notaActivaVisual === -1 && tiempoActual - timerAnimacion > 250) {
            if (indiceSecuencia < secuencia.length) {
                let notaATocar = secuencia[indiceSecuencia];
                piano.triggerAttackRelease(notaATocar, "0.6");
                notaActivaVisual = pentacordio.indexOf(notaATocar); timerAnimacion = millis();
            } else { gameState = "USER_TURN"; pasosUsuario = 0; notaActivaVisual = -1; }
        } else if (notaActivaVisual !== -1 && tiempoActual - timerAnimacion > 650) {
            notaActivaVisual = -1; indiceSecuencia++; timerAnimacion = millis();
        }
    }

    // --- DETECTOR DE ENTRADA CON ANTI-REBOTE INTEGRADO ---
    function mousePressed() {
        if (gameState !== "USER_TURN") return;

        // Si entran dos toques en menos de 300ms (clic fantasma móvil), el segundo se bloquea
        if (millis() - ultimoToque < 300) {
            return; 
        }

        for (let i = 0; i < teclas.length; i++) {
            let t = teclas[i];
            if (mouseX > t.x && mouseX < t.x + t.w && mouseY > t.y && mouseY < t.y + t.h) {
                ultimoToque = millis(); // Guardamos la marca de tiempo del toque válido
                handleUserinput(i);
                break;
            }
        }
    }

    function handleUserinput(indiceTecla) {
        let teclaTocada = teclas[indiceTecla];
        piano.triggerAttackRelease(teclaTocada.nota, "0.4");
        notaActivaVisual = indiceTecla;
        setTimeout(() => { if (gameState === "USER_TURN") notaActivaVisual = -1; }, 200);

        if (teclaTocada.nota === secuencia[pasosUsuario]) {
            pasosUsuario++;
            if (pasosUsuario === secuencia.length) {
                score = secuencia.length; if (score > highscore) highscore = score;
                gameState = "PLAYING_SEQUENCE"; setTimeout(agregarNuevaNotaASecuencia, 1200);
            }
        } else {
            gameState = "GAME_OVER"; notaActivaVisual = -1;
            btnFacil.show(); btnDificil.show();
            btnFacil.html('🟢 REINTENTAR FÁCIL'); btnDificil.html('🔴 REINTENTAR DIFÍCIL');
        }
    }

    function styleButton(btn, bgColor) {
        btn.style('background-color', bgColor); btn.style('color', '#ffffff'); btn.style('font-family', 'sans-serif'); btn.style('font-weight', 'bold'); btn.style('border', 'none'); btn.style('border-radius', '6px'); btn.style('cursor', 'pointer'); btn.style('font-size', '14px'); btn.style('transition', 'all 0.1s ease');
        btn.mouseOver(() => btn.style('filter', 'brightness(1.2)')); btn.mouseOut(() => btn.style('filter', 'brightness(1.0)'));
    }
</script>
</body>
</html>
