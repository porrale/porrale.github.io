<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katinvalo Quest: Reconocimiento de Intervalos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            padding: 10px; 
            background-color: #0f0f13; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
        }
        #game-container {
            position: relative;
            display: inline-block;
            border-radius: 14px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
        }
        canvas { 
            display: block; 
            border-radius: 14px;
        }
        .btn-game {
            position: absolute;
            font-family: inherit;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.12s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-game:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KX3GS3PD"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div id="game-container"></div>

<script>
    p5.disableFriendlyErrors = true; 

    let piano;
    
    const posicionesFisicas = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5", "D5", "E5", "F5", "G5", "A5", "B5"];
    const nombresNotasBasicas = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si", "Do", "Re", "Mi", "Fa", "Sol", "La", "Si"];
    const semitonosNotaBase = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23];

    const mapaSemitonos = { 
        0:"C4", 1:"Db4", 2:"D4", 3:"Eb4", 4:"E4", 5:"F4", 6:"F#4", 7:"G4", 8:"Ab4", 9:"A4", 10:"Bb4", 11:"B4", 
        12:"C5", 13:"Db5", 14:"D5", 15:"Eb5", 16:"E5", 17:"F5", 18:"F#5", 19:"G5", 20:"Ab5", 21:"A5", 22:"Bb5", 23:"B5", 24:"C6" 
    };

    const nombresFaciles = ["2da", "3ra", "4ta", "5ta", "6ta", "7ma"];
    const nombresDificiles = [
        "2da Menor", "2da Mayor", "3ra Menor", "3ra Mayor", 
        "4ta Justa", "4ta Aumentada", "5ta Disminuida", "5ta Justa", 
        "6ta Menor", "6ta Mayor", "7ma Disminuida", "7ma Menor", "7ma Mayor"
    ];

    // --- ESTADO DEL JUEGO ---
    let gameState = "LOADING"; 
    let gameMode = "FACIL"; 
    let opciones = [];
    let feedbackText = "";
    let feedbackColor;
    let score = 0;
    let highscore = 0;
    let ultimoToque = 0; 

    let sonidoNota1, sonidoNota2;
    let visualNota1, visualNota2;
    let textoAlteracionRojo = "";
    let respuestaCorrectaFacil = "";
    let respuestaCorrectaDificil = "";

    // --- INTERFAZ ---
    let btnVolver, btnPlay, btnArpegio, btnFacil, btnDificil;
    let botonesOpciones = [];

    function setup() {
        let cW = min(500, windowWidth - 20);
        let cH = min(680, windowHeight - 20);
        
        // Forzamos una altura mínima en pantallas chicas para que no se aprieten los botones
        if (cH < 600) cH = 600;

        let myCanvas = createCanvas(cW, cH);
        myCanvas.parent('game-container');
        textAlign(CENTER, CENTER);

        piano = new Tone.Sampler({
            urls: { "C4": "C4.mp3", "E4": "E4.mp3", "F#4": "Gb4.mp3", "A4": "A4.mp3" },
            baseUrl: "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/", 
            onload: () => { gameState = "START"; }
        }).toDestination();
        piano.volume.value = -2;

        btnVolver = createButton('⬅ VOLVER A EMPA');
        btnVolver.parent('game-container');
        btnVolver.addClass('btn-game');
        styleButton(btnVolver, '#2d3748');
        btnVolver.mousePressed(() => { window.location.href = './empa.html'; });

        btnFacil = createButton('🟢 FÁCIL');
        btnFacil.parent('game-container');
        btnFacil.addClass('btn-game');
        styleButton(btnFacil, '#2f855a');
        btnFacil.mousePressed(() => cambiarModo("FACIL"));

        btnDificil = createButton('🔴 DIFÍCIL');
        btnDificil.parent('game-container');
        btnDificil.addClass('btn-game');
        styleButton(btnDificil, '#2d3748'); 
        btnDificil.mousePressed(() => cambiarModo("DIFICIL"));

        btnPlay = createButton('🔊 GENERAR');
        btnPlay.parent('game-container');
        btnPlay.addClass('btn-game');
        styleButton(btnPlay, '#6200ee');
        btnPlay.mousePressed(handlePlayButton);
        btnPlay.hide(); 

        btnArpegio = createButton('🎶 ARPEGIAR');
        btnArpegio.parent('game-container');
        btnArpegio.addClass('btn-game');
        styleButton(btnArpegio, '#d97706');
        btnArpegio.mousePressed(reproducirArpegiado);
        btnArpegio.hide();

        for (let i = 0; i < 4; i++) {
            let btn = createButton('');
            btn.parent('game-container');
            btn.addClass('btn-game');
            styleButton(btn, '#2d3748');
            let index = i;
            btn.mousePressed(() => verificarRespuesta(index));
            btn.hide();
            botonesOpciones.push(btn);
        }

        feedbackColor = color(255);
        reposicionarControles();
    }

    function reposicionarControles() {
        let isMobile = width < 420;
        let padX = width * 0.06;

        // Botón Volver
        btnVolver.position(padX, 14);
        btnVolver.size(isMobile ? 105 : 125, 28);
        btnVolver.style('font-size', isMobile ? '10px' : '11px');

        // Botones de Modo (Modo Fácil / Difícil)
        let anchoModo = (width - (padX * 2) - 10) / 2;
        let yModo = height * 0.44;
        let hModo = 38;

        btnFacil.position(padX, yModo);
        btnFacil.size(anchoModo, hModo);
        btnFacil.style('font-size', isMobile ? '11px' : '13px');

        btnDificil.position(padX + anchoModo + 10, yModo);
        btnDificil.size(anchoModo, hModo);
        btnDificil.style('font-size', isMobile ? '11px' : '13px');

        // Botones de Reproducción
        let yAudio = yModo + hModo + 14;
        let hAudio = 42;

        if (gameState === "START") {
            let anchoPlaySolo = width - (padX * 2);
            btnPlay.position(padX, yAudio);
            btnPlay.size(anchoPlaySolo, hAudio);
            btnPlay.style('font-size', isMobile ? '12px' : '14px');
        } else {
            let anchoAudio = (width - (padX * 2) - 10) / 2;
            btnPlay.position(padX, yAudio);
            btnPlay.size(anchoAudio, hAudio);
            btnPlay.style('font-size', isMobile ? '11px' : '13px');

            btnArpegio.position(padX + anchoAudio + 10, yAudio);
            btnArpegio.size(anchoAudio, hAudio);
            btnArpegio.style('font-size', isMobile ? '11px' : '13px');
        }

        // Grilla de Respuestas (2 filas x 2 columnas)
        let anchoOpc = (width - (padX * 2) - 10) / 2;
        let hOpc = isMobile ? 44 : 48;
        let gapY = 8;
        let yFila1 = height * 0.70;
        let yFila2 = yFila1 + hOpc + gapY;

        let posX = [padX, padX + anchoOpc + 10, padX, padX + anchoOpc + 10];
        let posY = [yFila1, yFila1, yFila2, yFila2];

        for (let i = 0; i < 4; i++) {
            botonesOpciones[i].position(posX[i], posY[i]);
            botonesOpciones[i].size(anchoOpc, hOpc);
            botonesOpciones[i].style('font-size', isMobile ? '12px' : '14px');
        }
    }

    function draw() {
        background(18, 18, 24);

        let isMobile = width < 420;

        // Título
        fill('#e2e8f0');
        textSize(isMobile ? 18 : 22);
        textStyle(BOLD);
        text("Katinvalo QUEST", width / 2 + (isMobile ? 35 : 45), 28);
        
        // Subtítulo
        textSize(isMobile ? 11 : 12);
        textStyle(NORMAL);
        fill('#a0aec0');
        text(`Nivel: MODO ${gameMode} • Do a Si`, width / 2, 60);

        drawScoreboard();
        drawPentagrama();

        // Texto de Estado / Feedback (Ubicado justo entre los controles de audio y las respuestas)
        let yTextoFeedback = height * 0.63;
        if (gameState === "LOADING") {
            fill('#ecc94b');
            textSize(isMobile ? 13 : 15);
            text("Cargando piano... 🎹", width / 2, yTextoFeedback);
        } else if (gameState === "START") {
            fill('#cbd5e0');
            textSize(isMobile ? 12 : 14);
            text("Seleccioná un nivel y generá un intervalo", width / 2, yTextoFeedback);
            btnPlay.show();
            btnArpegio.hide();
        } else if (gameState === "PLAYING") {
            fill('#63b3ed');
            textSize(isMobile ? 13 : 15);
            text("¿Qué intervalo está graficado?", width / 2, yTextoFeedback);
        } else if (gameState === "ANSWERED") {
            fill(feedbackColor);
            textSize(isMobile ? 14 : 16);
            textStyle(BOLD);
            text(feedbackText, width / 2, yTextoFeedback);
            textStyle(NORMAL);
        }
    }

    function cambiarModo(nuevoModo) {
        gameMode = nuevoModo;
        score = 0; 
        if (gameMode === "FACIL") {
            styleButton(btnFacil, '#2f855a');
            styleButton(btnDificil, '#2d3748');
        } else {
            styleButton(btnFacil, '#2d3748');
            styleButton(btnDificil, '#9b2c2c');
        }
        if (gameState !== "START" && gameState !== "LOADING") {
            ocultarOpciones();
            btnPlay.html('🔊 GENERAR INTERVALO');
            styleButton(btnPlay, '#6200ee');
            btnArpegio.hide();
            gameState = "START";
            reposicionarControles();
        }
    }

    function drawPentagrama() {
        let pY = height * 0.24; 
        let espaciado = width < 420 ? 11 : 13; 
        let margenX = width * 0.08;

        stroke(240, 240, 240, 150);
        strokeWeight(1.5);

        for (let i = -2; i <= 2; i++) {
            let y = pY + (i * espaciado);
            line(margenX, y, width - margenX, y);
        }

        line(margenX, pY - (2 * espaciado), margenX, pY + (2 * espaciado));
        line(width - margenX, pY - (2 * espaciado), width - margenX, pY + (2 * espaciado));

        if (gameState === "PLAYING" || gameState === "ANSWERED") {
            let yLineaInferior = pY + (2 * espaciado); 
            let indiceMi4 = 2; 

            // Nota 1
            let h1 = posicionesFisicas.indexOf(visualNota1);
            let yNota1 = yLineaInferior - (h1 - indiceMi4) * (espaciado / 2);
            strokeWeight(1); fill(255); stroke(255);
            ellipse(width / 2 - 25, yNota1, 14, 10); 
            
            if (visualNota1 === "C4") {
                stroke(255); strokeWeight(2);
                line(width / 2 - 38, yNota1, width / 2 - 12, yNota1);
            }

            // Nota 2
            let h2 = posicionesFisicas.indexOf(visualNota2);
            let yNota2 = yLineaInferior - (h2 - indiceMi4) * (espaciado / 2);
            strokeWeight(1); fill(255); stroke(255);
            ellipse(width / 2 + 25, yNota2, 14, 10);

            if (visualNota2 === "C4") {
                stroke(255); strokeWeight(2);
                line(width / 2 + 12, yNota2, width / 2 + 38, yNota2);
            }

            if (gameMode === "DIFICIL" && textoAlteracionRojo !== "") {
                noStroke();
                fill('#ff4444');        
                textSize(width < 420 ? 13 : 15);           
                textStyle(BOLD);     
                text(textoAlteracionRojo, width / 2 + 25, yNota2 + 20);
            }
        }
    }

    function drawScoreboard() {
        let boxW = width * 0.88;
        let boxH = 46;
        let boxX = (width - boxW) / 2;
        let boxY = 76;

        stroke('#2d3748'); strokeWeight(1.5); fill(26, 26, 36); 
        rect(boxX, boxY, boxW, boxH, 8);

        noStroke(); fill('#a0aec0'); 
        textSize(width < 420 ? 9 : 10); 
        text("RACHA", boxX + boxW * 0.28, boxY + 15); 
        text("RÉCORD", boxX + boxW * 0.72, boxY + 15);

        fill('#fff'); 
        textSize(width < 420 ? 17 : 20); 
        textStyle(BOLD); 
        text(score, boxX + boxW * 0.28, boxY + 33); 
        text(highscore, boxX + boxW * 0.72, boxY + 33); 
        textStyle(NORMAL);
    }

    function handlePlayButton() {
        if (gameState === "LOADING") return;
        Tone.start();
        if (gameState === "PLAYING") {
            piano.triggerAttackRelease([sonidoNota1, sonidoNota2], "2.0");
        } else {
            generarIntervaloTransportado();
        }
    }

    function reproducirArpegiado() {
        if (gameState === "LOADING" || !sonidoNota1 || !sonidoNota2) return;
        Tone.start();
        piano.triggerAttackRelease(sonidoNota1, "0.7");
        setTimeout(() => {
            piano.triggerAttackRelease(sonidoNota2, "1.2");
        }, 800);
    }

    function clasificarIntervaloExacto(grados, semitonos) {
        if (grados === 1) { 
            if (semitonos === 1) return "2da Menor";
            if (semitonos === 2) return "2da Mayor";
        } else if (grados === 2) { 
            if (semitonos === 3) return "3ra Menor";
            if (semitonos === 4) return "3ra Mayor";
        } else if (grados === 3) { 
            if (semitonos === 5) return "4ta Justa";
            if (semitonos === 6) return "4ta Aumentada";
        } else if (grados === 4) { 
            if (semitonos === 6) return "5ta Disminuida";
            if (semitonos === 7) return "5ta Justa";
        } else if (grados === 5) { 
            if (semitonos === 8) return "6ta Menor";
            if (semitonos === 9) return "6ta Mayor";
        } else if (grados === 6) { 
            if (semitonos === 9)  return "7ma Disminuida";
            if (semitonos === 10) return "7ma Menor";
            if (semitonos === 11) return "7ma Mayor";
        }
        return null;
    }

    function generarIntervaloTransportado() {
        let indiceBase = Math.floor(random(0, 7)); 
        visualNota1 = posicionesFisicas[indiceBase];
        let semitonosBase = semitonosNotaBase[indiceBase];
        sonidoNota1 = mapaSemitonos[semitonosBase];

        let saltoGrado = Math.floor(random(1, 7));
        let nombresGenericos = { 1: "2da", 2: "3ra", 3: "4ta", 4: "5ta", 5: "6ta", 6: "7ma" };
        respuestaCorrectaFacil = nombresGenericos[saltoGrado];

        let indiceVisualDestino = indiceBase + saltoGrado;
        visualNota2 = posicionesFisicas[indiceVisualDestino];
        let nombreNotaDestinoBase = nombresNotasBasicas[indiceVisualDestino];

        let clasificacion = null;
        let altElegida = "";
        let semitonosDestino = 0;

        while (clasificacion === null) {
            altElegida = (gameMode === "DIFICIL") ? random(["", "b", "#"]) : "";
            
            let modSemitonos = 0;
            if (altElegida === "b") modSemitonos = -1;
            if (altElegida === "#") modSemitonos = 1;

            semitonosDestino = semitonosNotaBase[indiceVisualDestino] + modSemitonos;
            let semitonosDiferencia = semitonosDestino - semitonosBase;

            clasificacion = clasificarIntervaloExacto(saltoGrado, semitonosDiferencia);
        }

        respuestaCorrectaDificil = clasificacion;
        sonidoNota2 = mapaSemitonos[semitonosDestino];

        if (altElegida !== "") {
            textoAlteracionRojo = `${nombreNotaDestinoBase} ${altElegida}`;
        } else {
            textoAlteracionRojo = "";
        }

        piano.triggerAttackRelease([sonidoNota1, sonidoNota2], "2.0");
        armarOpciones();

        btnPlay.html('🔁 ARMÓNICO');
        styleButton(btnPlay, '#319795');
        btnArpegio.show();

        gameState = "PLAYING";
        reposicionarControles();
    }

    function armarOpciones() {
        let correcta = (gameMode === "FACIL") ? respuestaCorrectaFacil : respuestaCorrectaDificil;
        let bolsaOpciones = (gameMode === "FACIL") ? nombresFaciles : nombresDificiles;

        let distractores = bolsaOpciones.filter(item => item !== correcta);
        distractores = shuffle(distractores);

        opciones = [correcta, distractores[0], distractores[1], distractores[2]];
        opciones = shuffle(opciones);

        for (let i = 0; i < 4; i++) {
            botonesOpciones[i].html(opciones[i]);
            styleButton(botonesOpciones[i], '#2d3748'); 
            botonesOpciones[i].show();
        }
    }

    function verificarRespuesta(indiceBoton) {
        if (gameState !== "PLAYING") return;
        if (millis() - ultimoToque < 300) return;
        ultimoToque = millis();

        let respuestaUsuario = opciones[indiceBoton];
        let correcta = (gameMode === "FACIL") ? respuestaCorrectaFacil : respuestaCorrectaDificil;

        if (respuestaUsuario === correcta) {
            feedbackText = `¡CORRECTO! 🌟 Es una ${correcta}`;
            feedbackColor = color('#48bb78');
            score++;
            if (score > highscore) highscore = score;
            styleButton(botonesOpciones[indiceBoton], '#48bb78'); 
        } else {
            feedbackText = `INCORRECTO 😢 Era una ${correcta}`;
            feedbackColor = color('#f56565');
            score = 0;
            styleButton(botonesOpciones[indiceBoton], '#f56565'); 
        }

        btnPlay.html('🔊 SIGUIENTE');
        styleButton(btnPlay, '#6200ee');
        gameState = "ANSWERED";
    }

    function ocultarOpciones() {
        for (let i = 0; i < 4; i++) {
            botonesOpciones[i].hide();
        }
    }

    function styleButton(btn, bgColor) {
        btn.style('background-color', bgColor); 
        btn.style('color', '#ffffff'); 
        btn.mouseOver(() => btn.style('filter', 'brightness(1.18)')); 
        btn.mouseOut(() => btn.style('filter', 'brightness(1.0)'));
    }

    function windowResized() {
        let cW = min(500, windowWidth - 20);
        let cH = min(680, windowHeight - 20);
        if (cH < 600) cH = 600;
        resizeCanvas(cW, cH);
        reposicionarControles();
    }
</script>
</body>
</html>
