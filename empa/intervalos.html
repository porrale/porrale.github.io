<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katinvalo Quest: Reconocimiento de Intervalos</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0f0f13; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
        }
        canvas { 
            display: block; 
            border-radius: 12px; 
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
<script>
    p5.disableFriendlyErrors = true; 

    // --- MOTOR DE AUDIO ---
    let piano;
    
    const posicionesFisicas = ["C4", "D4", "E4", "F4", "G4", "A4", "B4", "C5", "D5", "E5", "F5", "G5", "A5", "B5"];
    const nombresNotasBasicas = ["Do", "Re", "Mi", "Fa", "Sol", "La", "Si", "Do", "Re", "Mi", "Fa", "Sol", "La", "Si"];
    const semitonosNotaBase = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23];

    const mapaSemitonos = { 
        0:"C4", 1:"Db4", 2:"D4", 3:"Eb4", 4:"E4", 5:"F4", 6:"F#4", 7:"G4", 8:"Ab4", 9:"A4", 10:"Bb4", 11:"B4", 
        12:"C5", 13:"Db5", 14:"D5", 15:"Eb5", 16:"E5", 17:"F5", 18:"F#5", 19:"G5", 20:"Ab5", 21:"A5", 22:"Bb5", 23:"B5", 24:"C6" 
    };

    const nombresFaciles = ["2da", "3ra", "4ta", "5ta", "6ta", "7ma"];
    const nombresDificiles = [
        "2da Menor", "2da Mayor", "3ra Menor", "3ra Mayor", 
        "4ta Justa", "4ta Aumentada", "5ta Disminuida", "5ta Justa", 
        "6ta Menor", "6ta Mayor", "7ma Disminuida", "7ma Menor", "7ma Mayor"
    ];

    // --- ESTADO DEL JUEGO ---
    let gameState = "LOADING"; 
    let gameMode = "FACIL"; 
    let opciones = [];
    let feedbackText = "";
    let feedbackColor;
    let score = 0;
    let highscore = 0;
    let ultimoToque = 0; 

    let sonidoNota1, sonidoNota2;
    let visualNota1, visualNota2;
    let textoAlteracionRojo = "";
    let respuestaCorrectaFacil = "";
    let respuestaCorrectaDificil = "";

    // --- INTERFAZ ---
    let btnVolver, btnPlay, btnArpegio, btnFacil, btnDificil;
    let botonesOpciones = [];

    function setup() {
        createCanvas(550, 680);
        textAlign(CENTER, CENTER);
        textFont("'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif");

        piano = new Tone.Sampler({
            urls: { "C4": "C4.mp3", "E4": "E4.mp3", "F#4": "Gb4.mp3", "A4": "A4.mp3" },
            baseUrl: "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/acoustic_grand_piano-mp3/", 
            onload: () => { gameState = "START"; }
        }).toDestination();
        piano.volume.value = -2;

        btnVolver = createButton('⬅ VOLVER A EMPA');
        btnVolver.position(20, 20);
        btnVolver.size(130, 32);
        styleButton(btnVolver, '#2d3748');
        btnVolver.style('font-size', '11px');
        btnVolver.mousePressed(() => { window.location.href = './empa.html'; });

        btnFacil = createButton('🟢 FÁCIL (Genéricos)');
        btnFacil.position(width / 2 - 190, 320);
        btnFacil.size(180, 40);
        styleButton(btnFacil, '#2f855a');
        btnFacil.mousePressed(() => cambiarModo("FACIL"));

        btnDificil = createButton('🔴 DIFÍCIL (Calificados)');
        btnDificil.position(width / 2 + 10, 320);
        btnDificil.size(180, 40);
        styleButton(btnDificil, '#2d3748'); 
        btnDificil.mousePressed(() => cambiarModo("DIFICIL"));

        // Botón principal Armónico / Generar
        btnPlay = createButton('🔊 GENERAR');
        btnPlay.position(width / 2 - 200, 380);
        btnPlay.size(190, 45);
        styleButton(btnPlay, '#6200ee');
        btnPlay.mousePressed(handlePlayButton);
        btnPlay.hide(); 

        // Botón nuevo: Arpegio (Melódico)
        btnArpegio = createButton('🎶 ARPEGIAR');
        btnArpegio.position(width / 2 + 10, 380);
        btnArpegio.size(190, 45);
        styleButton(btnArpegio, '#d97706');
        btnArpegio.mousePressed(reproducirArpegiado);
        btnArpegio.hide();

        let btnW = 190;
        let btnH = 50;
        let posX = [width / 2 - 200, width / 2 + 10, width / 2 - 200, width / 2 + 10];
        let posY = [490, 490, 555, 555];

        for (let i = 0; i < 4; i++) {
            let btn = createButton('');
            btn.position(posX[i], posY[i]);
            btn.size(btnW, btnH);
            styleButton(btn, '#2d3748');
            btn.style('font-size', '15px');
            let index = i;
            btn.mousePressed(() => verificarRespuesta(index));
            btn.hide();
            botonesOpciones.push(btn);
        }

        feedbackColor = color(255);
    }

    function draw() {
        background(18, 18, 24);

        fill('#e2e8f0');
        textSize(24);
        textStyle(BOLD);
        text("Katinvalo QUEST", width / 2 + 60, 36);
        
        textSize(13);
        textStyle(NORMAL);
        fill('#a0aec0');
        text(`Nivel: MODO ${gameMode} • Notas aleatorias de Do a Si`, width / 2, 85);

        drawScoreboard();
        drawPentagrama();

        if (gameState === "LOADING") {
            fill('#ecc94b');
            textSize(16);
            text("Cargando cuerdas de piano... 🎹", width / 2, 450);
        } else if (gameState === "START") {
            fill('#cbd5e0');
            textSize(15);
            text("Seleccioná un nivel y presioná Generar para empezar", width / 2, 450);
            btnPlay.position(width / 2 - 120, 380);
            btnPlay.size(240, 45);
            btnPlay.html('🔊 GENERAR INTERVALO');
            btnPlay.show();
            btnArpegio.hide();
        } else if (gameState === "PLAYING") {
            fill('#63b3ed');
            textSize(16);
            text("¿Qué intervalo está graficado?", width / 2, 450);
        } else if (gameState === "ANSWERED") {
            fill(feedbackColor);
            textSize(18);
            textStyle(BOLD);
            text(feedbackText, width / 2, 450);
            textStyle(NORMAL);
        }
    }

    function cambiarModo(nuevoModo) {
        gameMode = nuevoModo;
        score = 0; 
        if (gameMode === "FACIL") {
            styleButton(btnFacil, '#2f855a');
            styleButton(btnDificil, '#2d3748');
        } else {
            styleButton(btnFacil, '#2d3748');
            styleButton(btnDificil, '#9b2c2c');
        }
        if (gameState !== "START" && gameState !== "LOADING") {
            ocultarOpciones();
            btnPlay.html('🔊 GENERAR INTERVALO');
            styleButton(btnPlay, '#6200ee');
            btnArpegio.hide();
            gameState = "START";
        }
    }

    function drawPentagrama() {
        let pY = 210; 
        let espaciado = 14; 

        stroke(240, 240, 240, 150);
        strokeWeight(2);

        for (let i = -2; i <= 2; i++) {
            let y = pY + (i * espaciado);
            line(70, y, width - 70, y);
        }

        line(70, pY - (2 * espaciado), 70, pY + (2 * espaciado));
        line(width - 70, pY - (2 * espaciado), width - 70, pY + (2 * espaciado));

        if (gameState === "PLAYING" || gameState === "ANSWERED") {
            stroke(255);
            fill(255);

            let yLineaInferior = pY + (2 * espaciado); 
            let indiceMi4 = 2; 

            // Nota 1
            let h1 = posicionesFisicas.indexOf(visualNota1);
            let yNota1 = yLineaInferior - (h1 - indiceMi4) * (espaciado / 2);
            strokeWeight(1); fill(255); stroke(255);
            ellipse(width / 2 - 20, yNota1, 15, 10); 
            
            if (visualNota1 === "C4") {
                stroke(255); strokeWeight(2);
                line(width / 2 - 35, yNota1, width / 2 - 5, yNota1);
            }

            // Nota 2
            let h2 = posicionesFisicas.indexOf(visualNota2);
            let yNota2 = yLineaInferior - (h2 - indiceMi4) * (espaciado / 2);
            strokeWeight(1); fill(255); stroke(255);
            ellipse(width / 2 + 30, yNota2, 15, 10);

            if (visualNota2 === "C4") {
                stroke(255); strokeWeight(2);
                line(width / 2 + 15, yNota2, width / 2 + 45, yNota2);
            }

            if (gameMode === "DIFICIL" && textoAlteracionRojo !== "") {
                noStroke();
                fill('#ff4444');        
                textSize(16);           
                textStyle(BOLD);     
                text(textoAlteracionRojo, width / 2 + 30, yNota2 + 24);
            }
        }
    }

    function drawScoreboard() {
        stroke('#2d3748'); strokeWeight(2); fill(26, 26, 36); rect(75, 105, 400, 65, 8);
        noStroke(); fill('#a0aec0'); textSize(12); text("RACHA ACTUAL", 175, 125); text("MÁXIMO RÉCORD", 375, 125);
        fill('#fff'); textSize(22); textStyle(BOLD); text(score, 175, 148); text(highscore, 375, 148); textStyle(NORMAL);
    }

    function handlePlayButton() {
        if (gameState === "LOADING") return;
        Tone.start();
        if (gameState === "PLAYING") {
            piano.triggerAttackRelease([sonidoNota1, sonidoNota2], "2.5");
        } else {
            generarIntervaloTransportado();
        }
    }

    // Reproducción melódica secuencial (grave -> aguda)
// Reproducción melódica sucesiva y limpia (Primero nota 1, luego nota 2)
    function reproducirArpegiado() {
        if (gameState === "LOADING" || !sonidoNota1 || !sonidoNota2) return;
        Tone.start();

        // 1. Toca primero la nota grave (duración: 0.7s)
        piano.triggerAttackRelease(sonidoNota1, "0.7");

        // 2. Espera 800ms para disparar la segunda nota de forma sucesiva y clara
        setTimeout(() => {
            piano.triggerAttackRelease(sonidoNota2, "1.2");
        }, 800);
    }

    // CLASIFICADOR MATEMÁTICO REAL DE INTERVALOS
    function clasificarIntervaloExacto(grados, semitonos) {
        if (grados === 1) { // Segunda
            if (semitonos === 1) return "2da Menor";
            if (semitonos === 2) return "2da Mayor";
        } else if (grados === 2) { // Tercera
            if (semitonos === 3) return "3ra Menor";
            if (semitonos === 4) return "3ra Mayor";
        } else if (grados === 3) { // Cuarta
            if (semitonos === 5) return "4ta Justa";
            if (semitonos === 6) return "4ta Aumentada";
        } else if (grados === 4) { // Quinta
            if (semitonos === 6) return "5ta Disminuida";
            if (semitonos === 7) return "5ta Justa";
        } else if (grados === 5) { // Sexta
            if (semitonos === 8) return "6ta Menor";
            if (semitonos === 9) return "6ta Mayor";
        } else if (grados === 6) { // Séptima
            if (semitonos === 9)  return "7ma Disminuida";
            if (semitonos === 10) return "7ma Menor";
            if (semitonos === 11) return "7ma Mayor";
        }
        return null;
    }

    function generarIntervaloTransportado() {
        let indiceBase = Math.floor(random(0, 7)); 
        visualNota1 = posicionesFisicas[indiceBase];
        let semitonosBase = semitonosNotaBase[indiceBase];
        sonidoNota1 = mapaSemitonos[semitonosBase];

        let saltoGrado = Math.floor(random(1, 7));
        let nombresGenericos = { 1: "2da", 2: "3ra", 3: "4ta", 4: "5ta", 5: "6ta", 6: "7ma" };
        respuestaCorrectaFacil = nombresGenericos[saltoGrado];

        let indiceVisualDestino = indiceBase + saltoGrado;
        visualNota2 = posicionesFisicas[indiceVisualDestino];
        let nombreNotaDestinoBase = nombresNotasBasicas[indiceVisualDestino];

        let clasificacion = null;
        let altElegida = "";
        let semitonosDestino = 0;

        while (clasificacion === null) {
            altElegida = (gameMode === "DIFICIL") ? random(["", "b", "#"]) : "";
            
            let modSemitonos = 0;
            if (altElegida === "b") modSemitonos = -1;
            if (altElegida === "#") modSemitonos = 1;

            semitonosDestino = semitonosNotaBase[indiceVisualDestino] + modSemitonos;
            let semitonosDiferencia = semitonosDestino - semitonosBase;

            clasificacion = clasificarIntervaloExacto(saltoGrado, semitonosDiferencia);
        }

        respuestaCorrectaDificil = clasificacion;
        sonidoNota2 = mapaSemitonos[semitonosDestino];

        if (altElegida !== "") {
            textoAlteracionRojo = `${nombreNotaDestinoBase} ${altElegida}`;
        } else {
            textoAlteracionRojo = "";
        }

        piano.triggerAttackRelease([sonidoNota1, sonidoNota2], "2.5");
        armarOpciones();

        // Reposicionamos y mostramos ambos botones parejos
        btnPlay.position(width / 2 - 200, 380);
        btnPlay.size(190, 45);
        btnPlay.html('🔁 ARMÓNICO');
        styleButton(btnPlay, '#319795');

        btnArpegio.position(width / 2 + 10, 380);
        btnArpegio.size(190, 45);
        btnArpegio.show();

        gameState = "PLAYING";
    }

    function armarOpciones() {
        let correcta = (gameMode === "FACIL") ? respuestaCorrectaFacil : respuestaCorrectaDificil;
        let bolsaOpciones = (gameMode === "FACIL") ? nombresFaciles : nombresDificiles;

        let distractores = bolsaOpciones.filter(item => item !== correcta);
        distractores = shuffle(distractores);

        opciones = [correcta, distractores[0], distractores[1], distractores[2]];
        opciones = shuffle(opciones);

        for (let i = 0; i < 4; i++) {
            botonesOpciones[i].html(opciones[i]);
            styleButton(botonesOpciones[i], '#2d3748'); 
            botonesOpciones[i].show();
        }
    }

    function verificarRespuesta(indiceBoton) {
        if (gameState !== "PLAYING") return;
        if (millis() - ultimoToque < 300) return;
        ultimoToque = millis();

        let respuestaUsuario = opciones[indiceBoton];
        let correcta = (gameMode === "FACIL") ? respuestaCorrectaFacil : respuestaCorrectaDificil;

        if (respuestaUsuario === correcta) {
            feedbackText = `¡CORRECTO! 🌟 Es una ${correcta}`;
            feedbackColor = color('#48bb78');
            score++;
            if (score > highscore) highscore = score;
            styleButton(botonesOpciones[indiceBoton], '#48bb78'); 
        } else {
            feedbackText = `INCORRECTO 😢 Era una ${correcta}`;
            feedbackColor = color('#f56565');
            score = 0;
            styleButton(botonesOpciones[indiceBoton], '#f56565'); 
        }

        btnPlay.html('🔊 SIGUIENTE');
        styleButton(btnPlay, '#6200ee');
        gameState = "ANSWERED";
    }

    function ocultarOpciones() {
        for (let i = 0; i < 4; i++) {
            botonesOpciones[i].hide();
        }
    }

    function styleButton(btn, bgColor) {
        btn.style('background-color', bgColor); 
        btn.style('color', '#ffffff'); 
        btn.style('font-family', 'sans-serif'); 
        btn.style('font-weight', 'bold'); 
        btn.style('border', 'none'); 
        btn.style('border-radius', '6px'); 
        btn.style('cursor', 'pointer'); 
        btn.style('transition', 'all 0.1s ease');
        btn.mouseOver(() => btn.style('filter', 'brightness(1.2)')); 
        btn.mouseOut(() => btn.style('filter', 'brightness(1.0)'));
    }
</script>
</body>
</html>
